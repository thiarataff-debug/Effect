<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteiro de Entrevista por Competências · Effect Pessoas</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="/templates-cargos.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2a4a;--bg:#f5f7fa;--muted:#a1a1aa;--green:#8ed1b2;--blue:#1fa5ff;--pink:#f4afa1;--text:#2a2a2b;--border:#e5e7eb}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:10px}
header .logo{font-weight:800;font-size:16px}header .logo span{color:var(--green)}
.container{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px}
.card-title{font-weight:800;font-size:14px;color:var(--navy);margin-bottom:12px}
label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
select,input[type=text]{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:9px;font-family:'Montserrat',sans-serif;font-size:13px;outline:none;background:#fff;color:var(--text)}
select:focus,input:focus{border-color:var(--blue)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > div{flex:1;min-width:200px}
.btn{padding:11px 20px;border-radius:9px;border:none;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--navy);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--navy)}
.actions{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.comp-card{border-radius:10px;padding:16px 18px;margin-bottom:12px;border-left:4px solid var(--blue);background:#f8fafc}
.comp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.comp-nome{font-weight:800;font-size:13px;color:var(--navy)}
.comp-peso{font-size:10px;font-weight:800;color:#fff;background:var(--blue);border-radius:20px;padding:3px 10px;white-space:nowrap}
.comp-desc{font-size:11.5px;color:#4b5563;margin-bottom:10px;line-height:1.5}
.comp-pergunta{background:#f0f7ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#1e40af;line-height:1.55;margin-bottom:10px}
.comp-pergunta::before{content:'"';font-size:16px;font-weight:900;opacity:.4;margin-right:3px}
.anchors-lbl{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.anchors-list{font-size:11px;color:#4b5563;line-height:1.7}
.anchors-list b{color:var(--navy)}
.empty-hint{color:var(--muted);font-size:12.5px;text-align:center;padding:30px 10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:9px;font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
@media print{
  header,.actions,.card:first-of-type{display:none!important}
  body{background:#fff}
  .container{max-width:100%;padding:0}
  .card{box-shadow:none;border:1px solid #e5e7eb;break-inside:avoid}
}
</style>
</head>
<body>

<header>
  <div class="logo">Effect <span>Pessoas</span></div>
  <div style="font-size:11px;color:rgba(255,255,255,.7)">Roteiro de Entrevista por Competências</div>
</header>

<div class="container">
  <div class="card">
    <div class="card-title">🎯 Monte o roteiro</div>
    <div class="row">
      <div>
        <label>Cargo</label>
        <select id="sel-cargo" onchange="renderRoteiro()"></select>
      </div>
      <div>
        <label>Vaga/observação <span style="font-weight:400;text-transform:none">(opcional, aparece no topo do roteiro)</span></label>
        <input type="text" id="inp-vaga" placeholder="Ex: Garçom — Unidade Shopping Vitória" oninput="renderRoteiro()">
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="copiarRoteiro()">📋 Copiar roteiro</button>
      <button class="btn btn-outline" onclick="window.print()">🖨️ Imprimir / salvar PDF</button>
    </div>
  </div>

  <div id="roteiro-cabecalho"></div>
  <div id="roteiro-lista"></div>
</div>

<div class="toast" id="toast">Copiado!</div>

<script>
function popularCargos() {
  const sel = document.getElementById('sel-cargo');
  sel.innerHTML = '<option value="">Selecione o cargo...</option>' +
    Object.entries(TEMPLATES).map(([k,t]) => `<option value="${k}">${t.label}</option>`).join('');
}

// Gera uma pergunta STAR a partir do nome/descrição da competência —
// mesmo raciocínio comportamental que a Lia já usava em avaliacao.html,
// só que aqui vira uma pergunta pronta pra fazer na entrevista.
function gerarPerguntaSTAR(comp) {
  return `Me conte sobre uma situação em que você precisou demonstrar ${comp.nome.toLowerCase()} — ${comp.desc.toLowerCase()}. `
    + `Qual era a situação, o que era esperado de você, o que exatamente você fez e qual foi o resultado?`;
}

function renderRoteiro() {
  const cargoKey = document.getElementById('sel-cargo').value;
  const vaga = document.getElementById('inp-vaga').value.trim();
  const cabecalho = document.getElementById('roteiro-cabecalho');
  const lista = document.getElementById('roteiro-lista');

  if (!cargoKey || !TEMPLATES[cargoKey]) {
    cabecalho.innerHTML = '';
    lista.innerHTML = '<div class="empty-hint">Selecione um cargo acima pra gerar o roteiro de perguntas.</div>';
    return;
  }

  const tmpl = TEMPLATES[cargoKey];
  cabecalho.innerHTML = `
    <div class="card">
      <div class="card-title">📋 ${tmpl.label}${vaga ? ' — ' + escapeHtml(vaga) : ''}</div>
      <p style="font-size:11.5px;color:var(--muted);line-height:1.5">
        Método <strong>STAR</strong> (Situação, Tarefa, Ação, Resultado). Faça a pergunta, deixe a pessoa contar a
        situação real e use as âncoras abaixo como referência pra pontuar depois — a pontuação em si é feita na
        ferramenta de <a href="/avaliacao" style="color:var(--blue);font-weight:700">Avaliação de Candidatos</a> durante a entrevista.
      </p>
    </div>`;

  lista.innerHTML = tmpl.competencias.map(comp => `
    <div class="comp-card">
      <div class="comp-top">
        <div class="comp-nome">${escapeHtml(comp.nome)}</div>
        <div class="comp-peso">peso ${comp.peso}%</div>
      </div>
      <div class="comp-desc">${escapeHtml(comp.desc)}</div>
      <div class="comp-pergunta">${escapeHtml(gerarPerguntaSTAR(comp))}</div>
      <div class="anchors-lbl">Guia de pontuação (1 a 5)</div>
      <div class="anchors-list">${comp.anchors.map((a,i) => `<div><b>${i+1}.</b> ${escapeHtml(a)}</div>`).join('')}</div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function copiarRoteiro() {
  const cargoKey = document.getElementById('sel-cargo').value;
  if (!cargoKey || !TEMPLATES[cargoKey]) { mostrarToast('Selecione um cargo primeiro'); return; }
  const vaga = document.getElementById('inp-vaga').value.trim();
  const tmpl = TEMPLATES[cargoKey];
  let texto = `ROTEIRO DE ENTREVISTA POR COMPETÊNCIAS — ${tmpl.label}${vaga ? ' — ' + vaga : ''}\nEffect Pessoas\n\n`;
  tmpl.competencias.forEach(comp => {
    texto += `${comp.nome} (peso ${comp.peso}%)\n${comp.desc}\n\nPergunta: ${gerarPerguntaSTAR(comp)}\n\nGuia de pontuação:\n`;
    comp.anchors.forEach((a,i) => { texto += `  ${i+1}. ${a}\n`; });
    texto += `\n${'─'.repeat(50)}\n\n`;
  });
  navigator.clipboard.writeText(texto).then(() => mostrarToast('Roteiro copiado!')).catch(() => mostrarToast('Não deu pra copiar — tente Imprimir/PDF'));
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

popularCargos();
renderRoteiro();
</script>
</body>
</html>
