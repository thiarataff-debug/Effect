<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lia Inbox — Effect</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #1a2a4a;
    --navy2: #2a2a2b;
    --white: #ffffff;
    --bg: #f5f7fa;
    --muted: #a1a1aa;
    --green: #8ed1b2;
    --blue: #1fa5ff;
    --pink: #f4afa1;
    --accent: #7b8e6e;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--bg);
    color: var(--navy2);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* LOGIN */
  #login-screen {
    position: fixed; inset: 0;
    background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  #login-screen.hidden { display: none; }

  .login-box {
    background: var(--white);
    border-radius: 16px;
    padding: 48px 40px;
    width: 340px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .login-box .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 4px;
  }
  .login-box .sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 32px;
  }
  .login-box input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--bg);
    border-radius: 10px;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border 0.2s;
  }
  .login-box input:focus { border-color: var(--blue); }
  .login-box button {
    width: 100%;
    padding: 12px;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .login-box button:hover { background: var(--blue); }
  .login-error { color: var(--pink); font-size: 12px; margin-top: 12px; display: none; }

  /* HEADER */
  header {
    background: var(--navy);
    color: white;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  .header-brand { font-weight: 700; font-size: 16px; }
  .header-brand span { color: var(--green); }
  .header-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* LAYOUT */
  .app { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR */
  .sidebar {
    width: 300px;
    background: white;
    border-right: 1px solid #e5e7eb;
    display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 700;
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .badge {
    background: var(--blue);
    color: white;
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 700;
  }
  .conversations { flex: 1; overflow-y: auto; }
  .conv-item {
    padding: 14px 16px;
    border-bottom: 1px solid #f3f4f6;
    cursor: pointer;
    transition: background 0.15s;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .conv-item:hover { background: var(--bg); }
  .conv-item.active { background: #eff6ff; border-left: 3px solid var(--blue); }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--navy);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
    flex-shrink: 0;
  }
  .conv-info { flex: 1; min-width: 0; }
  .conv-name { font-weight: 600; font-size: 13px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-preview { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .conv-time { font-size: 10px; color: var(--muted); }
  .unread { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

  .refresh-btn {
    margin: 12px 16px;
    padding: 10px;
    background: var(--bg);
    border: none;
    border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--navy2);
    cursor: pointer;
    width: calc(100% - 32px);
    transition: background 0.2s;
  }
  .refresh-btn:hover { background: #e2e8f0; }

  /* CHAT AREA */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  .chat-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--muted);
  }
  .chat-empty-icon { font-size: 48px; }
  .chat-empty-text { font-size: 14px; }

  .chat-header {
    background: white;
    padding: 16px 24px;
    border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .chat-header-info { flex: 1; }
  .chat-header-name { font-weight: 700; font-size: 15px; }
  .chat-header-phone { font-size: 12px; color: var(--muted); }

  .mode-toggle {
    display: flex; gap: 8px; align-items: center;
  }
  .mode-label { font-size: 11px; color: var(--muted); }
  .toggle-wrap { display: flex; gap: 4px; }
  .mode-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.lia { background: var(--bg); color: var(--muted); }
  .mode-btn.lia.active { background: var(--green); color: white; }
  .mode-btn.manual { background: var(--bg); color: var(--muted); }
  .mode-btn.manual.active { background: var(--pink); color: white; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.candidato {
    align-self: flex-start;
    background: white;
    border-bottom-left-radius: 3px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .msg.lia {
    align-self: flex-end;
    background: var(--navy);
    color: white;
    border-bottom-right-radius: 3px;
  }
  .msg.manual {
    align-self: flex-end;
    background: var(--pink);
    color: white;
    border-bottom-right-radius: 3px;
  }
  .msg-role {
    font-size: 10px;
    margin-bottom: 4px;
    font-weight: 600;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .input-area {
    background: white;
    padding: 16px 24px;
    border-top: 1px solid #e5e7eb;
    display: flex; gap: 12px; align-items: flex-end;
    flex-shrink: 0;
  }
  .input-area textarea {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid var(--bg);
    border-radius: 12px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    resize: none;
    outline: none;
    max-height: 120px;
    min-height: 44px;
    transition: border 0.2s;
    line-height: 1.5;
  }
  .input-area textarea:focus { border-color: var(--blue); }
  .send-btn {
    padding: 12px 20px;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .send-btn:hover { background: var(--blue); }
  .send-btn:disabled { background: var(--muted); cursor: not-allowed; }

  .manual-warning {
    background: #fff8f0;
    border: 1px solid var(--pink);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 11px;
    color: #b45309;
    margin: 0 24px 8px;
    display: none;
  }
  .manual-warning.show { display: block; }

  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--navy2);
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    z-index: 200;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: var(--green); color: var(--navy); }
  .toast.error { background: var(--pink); color: white; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">Effect <span style="color:#1fa5ff">Pessoas</span></div>
    <div class="sub">Inbox da Lia — Acesso restrito</div>
    <input type="password" id="senha-input" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')entrar()">
    <button onclick="entrar()">Entrar</button>
    <div class="login-error" id="login-error">Senha incorreta.</div>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="header-brand">Effect <span>Lia</span> Inbox</div>
  <div class="header-status">
    <div class="dot"></div>
    Bot ativo
  </div>
</header>

<!-- APP -->
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      Conversas
      <span class="badge" id="total-badge">0</span>
    </div>
    <div class="conversations" id="conv-list"></div>
    <button class="refresh-btn" onclick="carregarSessoes()">⟳ Atualizar conversas</button>
  </div>

  <!-- CHAT -->
  <div class="chat-area" id="chat-area">
    <div class="chat-empty" id="chat-empty">
      <div class="chat-empty-icon">💬</div>
      <div class="chat-empty-text">Selecione uma conversa</div>
    </div>

    <div id="chat-active" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
      <div class="chat-header">
        <div class="avatar" id="chat-avatar">?</div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chat-name">—</div>
          <div class="chat-header-phone" id="chat-phone">—</div>
        </div>
        <div class="mode-toggle">
          <span class="mode-label">Modo:</span>
          <div class="toggle-wrap">
            <button class="mode-btn lia active" id="btn-lia" onclick="setModo('lia')">🤖 Lia</button>
            <button class="mode-btn manual" id="btn-manual" onclick="setModo('manual')">✍️ Manual</button>
          </div>
        </div>
      </div>

      <div class="manual-warning" id="manual-warning">
        ✍️ Modo manual ativo — você está respondendo como Lia. O candidato não saberá.
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <textarea id="msg-input" placeholder="Digite sua mensagem..." rows="1"
          oninput="autoResize(this)"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar()}"></textarea>
        <button class="send-btn" id="send-btn" onclick="enviar()">Enviar</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SENHA = "effect2026";
const API_BASE = window.location.origin;

let sessaoAtual = null;
let modoAtual = 'lia';
let dadosSessoes = {};

// LOGIN
function entrar() {
  const v = document.getElementById('senha-input').value;
  if (v === SENHA) {
    document.getElementById('login-screen').classList.add('hidden');
    carregarSessoes();
    setInterval(carregarSessoes, 15000);
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

// CARREGAR SESSÕES
async function carregarSessoes() {
  try {
    const r = await fetch(`${API_BASE}/inbox/sessoes`);
    const data = await r.json();
    dadosSessoes = data.sessoes || {};
    renderizarLista();
  } catch(e) {
    console.error(e);
  }
}

function renderizarLista() {
  const lista = document.getElementById('conv-list');
  const total = Object.keys(dadosSessoes).length;
  document.getElementById('total-badge').textContent = total;

  if (total === 0) {
    lista.innerHTML = '<div style="padding:24px;text-align:center;color:#a1a1aa;font-size:13px;">Nenhuma conversa ativa</div>';
    return;
  }

  lista.innerHTML = '';
  Object.entries(dadosSessoes).forEach(([tel, sessao]) => {
    const hist = sessao.historico || [];
    const ultimaMsg = hist[hist.length - 1];
    const nome = sessao.nome || extrairNome(hist) || formatarTel(tel);
    const inicial = nome.charAt(0).toUpperCase();
    const preview = ultimaMsg ? ultimaMsg.content.slice(0, 50) : 'Sem mensagens';

    const div = document.createElement('div');
    div.className = 'conv-item' + (sessaoAtual === tel ? ' active' : '');
    div.innerHTML = `
      <div class="avatar">${inicial}</div>
      <div class="conv-info">
        <div class="conv-name">${nome}</div>
        <div class="conv-preview">${preview}</div>
      </div>
      <div class="conv-meta">
        <div class="conv-time">${hist.length} msgs</div>
      </div>
    `;
    div.onclick = () => abrirConversa(tel, nome, sessao);
    lista.appendChild(div);
  });
}

function extrairNome(hist) {
  for (const h of hist) {
    if (h.role === 'assistant' && h.content.includes('Prazer')) {
      const match = h.content.match(/Prazer[^,]*,\s*(\w+)/i);
      if (match) return match[1];
    }
  }
  return null;
}

function formatarTel(tel) {
  if (tel.length >= 11) return `(${tel.slice(2,4)}) ${tel.slice(4,9)}-${tel.slice(9)}`;
  return tel;
}

// ABRIR CONVERSA
function abrirConversa(tel, nome, sessao) {
  sessaoAtual = tel;
  document.getElementById('chat-empty').style.display = 'none';
  const chatActive = document.getElementById('chat-active');
  chatActive.style.display = 'flex';

  const inicial = nome.charAt(0).toUpperCase();
  document.getElementById('chat-avatar').textContent = inicial;
  document.getElementById('chat-name').textContent = nome;
  document.getElementById('chat-phone').textContent = `+${tel}`;

  renderizarMensagens(sessao.historico || []);
  renderizarLista();

  document.getElementById('msg-input').focus();
}

function renderizarMensagens(historico) {
  const div = document.getElementById('messages');
  div.innerHTML = '';

  historico.forEach(msg => {
    const el = document.createElement('div');
    const isUser = msg.role === 'user';
    el.className = `msg ${isUser ? 'candidato' : 'lia'}`;

    const roleLabel = document.createElement('div');
    roleLabel.className = 'msg-role';
    roleLabel.textContent = isUser ? 'Candidato' : 'Lia';
    el.appendChild(roleLabel);

    const texto = document.createElement('span');
    texto.textContent = msg.content;
    el.appendChild(texto);

    div.appendChild(el);
  });

  div.scrollTop = div.scrollHeight;
}

// MODO
function setModo(modo) {
  modoAtual = modo;
  document.getElementById('btn-lia').classList.toggle('active', modo === 'lia');
  document.getElementById('btn-manual').classList.toggle('active', modo === 'manual');
  const warn = document.getElementById('manual-warning');
  warn.classList.toggle('show', modo === 'manual');
  document.getElementById('msg-input').placeholder = modo === 'lia'
    ? 'A Lia responde automaticamente. Clique em Enviar para forçar uma resposta.'
    : 'Digite sua mensagem (você responde como Lia)...';
}

// ENVIAR
async function enviar() {
  if (!sessaoAtual) return;

  const input = document.getElementById('msg-input');
  const texto = input.value.trim();
  if (!texto) return;

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const r = await fetch(`${API_BASE}/inbox/enviar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        telefone: sessaoAtual,
        mensagem: texto,
        modo: modoAtual
      })
    });
    const data = await r.json();

    if (data.ok) {
      input.value = '';
      input.style.height = 'auto';
      mostrarToast('Mensagem enviada!', 'success');
      await carregarSessoes();
      if (dadosSessoes[sessaoAtual]) {
        renderizarMensagens(dadosSessoes[sessaoAtual].historico || []);
      }
    } else {
      mostrarToast('Erro ao enviar: ' + (data.erro || 'Tente novamente'), 'error');
    }
  } catch(e) {
    mostrarToast('Erro de conexão', 'error');
  }

  btn.disabled = false;
  btn.textContent = 'Enviar';
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function mostrarToast(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${tipo}`;
  setTimeout(() => t.className = 'toast', 2500);
}
</script>
</body>
</html>
