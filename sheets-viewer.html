<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Effect — ATS Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2a4a;--bg:#f5f7fa;--muted:#a1a1aa;--green:#8ed1b2;--blue:#1fa5ff;--pink:#f4afa1;--text:#2a2a2b;--white:#fff;--border:#e5e7eb}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* LOGIN */
#login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:200}
#login.hidden{display:none}
.lbox{background:#fff;border-radius:16px;padding:48px 40px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.llogo{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:4px}.llogo span{color:var(--green)}
.lsub{font-size:12px;color:var(--muted);margin-bottom:28px}
.lbox input{width:100%;padding:12px 16px;border:2px solid var(--bg);border-radius:10px;font-family:'Montserrat',sans-serif;font-size:14px;outline:none;margin-bottom:14px}
.lbox input:focus{border-color:var(--blue)}
.lbox button{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
.lbox button:hover{background:var(--blue)}
.lerr{color:var(--pink);font-size:12px;margin-top:10px;display:none}
/* HEADER */
header{background:var(--navy);color:#fff;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hlogo{font-weight:800;font-size:15px}.hlogo span{color:var(--green)}
.htabs{display:flex;gap:3px}
.htab{padding:7px 14px;border-radius:8px;border:none;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);transition:all .15s;white-space:nowrap}
.htab.active{background:var(--blue);color:#fff}
.htab:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}
.hright{display:flex;align-items:center;gap:8px}
.upd{font-size:10px;color:var(--muted)}
.rbtn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:7px;padding:6px 12px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;cursor:pointer}
.rbtn:hover{background:rgba(255,255,255,.22)}
/* CONTENT */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.page{flex:1;overflow-y:auto;padding:20px 24px;display:none}
.page.active{display:block}
/* STATS BAR */
.sbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.scard{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-left:4px solid var(--border)}
.scard.blue{border-left-color:var(--blue)}.scard.green{border-left-color:var(--green)}.scard.yellow{border-left-color:#f59e0b}.scard.red{border-left-color:var(--pink)}.scard.navy{border-left-color:var(--navy)}
.snum{font-size:26px;font-weight:800;color:var(--navy);line-height:1}
.slabel{font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
/* FILTER BAR */
.fbar{background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.fi{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Montserrat',sans-serif;font-size:12px;outline:none;min-width:180px}
.fi:focus{border-color:var(--blue)}
.fc{padding:4px 11px;border-radius:16px;border:1.5px solid var(--border);font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;cursor:pointer;background:#fff;transition:all .15s}
.fc:hover{border-color:var(--navy)}
.fc.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* BADGES / CHIPS */
.chip{padding:2px 7px;border-radius:8px;font-size:9px;font-weight:700;display:inline-block}
.cg{background:#dcfce7;color:#16a34a}.cb{background:#dbeafe;color:#1d4ed8}.cy{background:#fef9c3;color:#a16207}.cr{background:#fee2e2;color:#dc2626}.cn{background:#e8edf5;color:var(--navy)}.cm{background:#f3f4f6;color:var(--muted)}.cp{background:#fde8e4;color:#b04a38}
/* CANDIDATOS CARDS */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:13px}
.ccard{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1.5px solid var(--border);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.ccard:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.09)}
.ctop{padding:13px 15px 10px;display:flex;align-items:flex-start;gap:9px;border-bottom:1px solid #f3f4f6}
.ctop.excelente{background:linear-gradient(135deg,#fff8e7,#fff 60%);border-left:4px solid #f59e0b}
.ctop.bom{background:linear-gradient(135deg,#edfaf4,#fff 60%);border-left:4px solid var(--green)}
.ctop.regular{background:linear-gradient(135deg,#fffde7,#fff 60%);border-left:4px solid #facc15}
.ctop.reprovado{background:linear-gradient(135deg,#fff0f0,#fff 60%);border-left:4px solid var(--pink);opacity:.75}
.ctop.default{background:#fff;border-left:4px solid var(--border)}
.cav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.cav.excelente{background:#f59e0b}.cav.bom{background:var(--green);color:var(--navy)}.cav.regular{background:#facc15;color:var(--navy)}.cav.reprovado{background:var(--pink)}.cav.default{background:var(--navy)}
.chi{flex:1;min-width:0}
.cname{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.csub{font-size:9px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sc{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0}
.sa{background:#dcfce7;color:#15803d}.sm{background:#fef9c3;color:#a16207}.sb{background:#fee2e2;color:#dc2626}.sz{background:#f3f4f6;color:var(--muted)}
.cbody{padding:10px 14px;flex:1;display:flex;flex-direction:column;gap:7px}
.vtag{display:inline-flex;align-items:center;gap:4px;background:#eff6ff;color:#1d4ed8;border-radius:5px;padding:2px 8px;font-size:9px;font-weight:700;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cchips{display:flex;flex-wrap:wrap;gap:3px}
.pf{font-size:10px;color:#555;line-height:1.5;background:#f8fafc;border-radius:5px;padding:5px 8px;border-left:3px solid var(--green)}
.cfoot{padding:7px 14px;border-top:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between;background:#fafbfc}
.cdate{font-size:9px;color:var(--muted)}
.cacts{display:flex;gap:4px}
.abtn{padding:3px 8px;border-radius:5px;border:none;font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;cursor:pointer}
.abtn.wa{background:#25D366;color:#fff}
.abtn.st{background:#e8edf5;color:var(--navy)}
.abtn.st:hover{background:var(--navy);color:#fff}
.clsbdg{padding:2px 6px;border-radius:7px;font-size:9px;font-weight:700}
.clse{background:#fef3c7;color:#92400e}.clsb{background:#dcfce7;color:#16a34a}.clsr{background:#fef9c3;color:#a16207}.clsrp{background:#fee2e2;color:#dc2626}.clsd{background:#f3f4f6;color:var(--muted)}
/* VAGAS CARDS */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.vcard{background:#fff;border-radius:11px;padding:15px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-left:4px solid var(--blue);display:flex;flex-direction:column;gap:8px}
.vcard.enc{border-left-color:var(--muted);opacity:.65}
.vtit{font-weight:700;font-size:13px;color:var(--navy)}
.vcli{font-size:10px;color:var(--blue);font-weight:600}
.vrows{display:flex;flex-direction:column;gap:3px}
.vrow{display:flex;gap:5px;font-size:10.5px;color:#555;align-items:flex-start}
.vico{flex-shrink:0;color:var(--muted);width:13px;text-align:center}
.vfoot{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
/* CONVERSAS */
.conv-table{background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.conv-table table{width:100%;border-collapse:collapse;font-size:11px}
.conv-table thead th{background:var(--navy);color:#fff;padding:9px 12px;text-align:left;font-weight:700;font-size:10px;white-space:nowrap}
.conv-table tbody td{padding:8px 12px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.conv-table tbody tr:hover td{background:#f8fafc}
.conv-table tbody tr:last-child td{border-bottom:none}
.role-user{background:#eff6ff;color:#1d4ed8;padding:2px 6px;border-radius:5px;font-size:9px;font-weight:700}
.role-lia{background:#e8edf5;color:var(--navy);padding:2px 6px;border-radius:5px;font-size:9px;font-weight:700}
.msg-cell{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.dbox{background:#fff;border-radius:11px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.dbox.full{grid-column:1/-1}
.dbox-title{font-weight:700;font-size:11px;color:var(--navy);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;padding-bottom:7px;border-bottom:2px solid var(--blue)}
.brow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:10px}
.blabel{width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{flex:1;background:#f3f4f6;border-radius:3px;height:12px;overflow:hidden}
.bfill{height:100%;border-radius:3px;transition:width .5s}
.bval{width:26px;text-align:right;font-weight:700;color:var(--navy)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.kpi{background:#f8fafc;border-radius:8px;padding:12px;text-align:center}
.knum{font-size:22px;font-weight:800;color:var(--navy);line-height:1}
.klabel{font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
/* INDICADORES */
.ind-table{background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:16px}
.ind-table table{width:100%;border-collapse:collapse;font-size:11px}
.ind-table thead th{background:var(--navy);color:#fff;padding:9px 14px;text-align:left;font-weight:700;font-size:10px}
.ind-table tbody td{padding:10px 14px;border-bottom:1px solid #f3f4f6}
.ind-table tbody tr:last-child td{border-bottom:none}
.ind-table tbody tr:hover td{background:#f8fafc}
.ind-val{font-weight:700;color:var(--navy)}
.ind-meta{font-size:9px;color:var(--muted)}
.pct-bar{display:flex;align-items:center;gap:6px}
.pct-track{flex:1;background:#f3f4f6;border-radius:3px;height:8px;overflow:hidden}
.pct-fill{height:100%;border-radius:3px}
/* FUNIL */
.funil-wrap{display:flex;flex-direction:column;gap:6px;max-width:600px;margin-bottom:16px}
.funil-et{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.funil-icon{font-size:18px;width:28px;text-align:center;flex-shrink:0}
.funil-info{flex:1}
.funil-name{font-weight:700;font-size:12px;color:var(--navy)}
.funil-sub{font-size:10px;color:var(--muted);margin-top:2px}
.funil-num{font-weight:800;font-size:18px;color:var(--navy);flex-shrink:0}
.funil-pct{font-size:10px;color:var(--muted);width:35px;text-align:right;flex-shrink:0}
.funil-bar-wrap{flex:1;max-width:120px}
.funil-bar-track{background:#f3f4f6;border-radius:3px;height:6px;overflow:hidden}
.funil-bar-fill{height:100%;border-radius:3px;transition:width .5s}
/* CONSOLIDADO */
.cons-table{background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.cons-table table{width:100%;border-collapse:collapse;font-size:11px}
.cons-table thead th{background:var(--navy);color:#fff;padding:9px 12px;text-align:left;font-weight:700;font-size:10px;white-space:nowrap}
.cons-table tbody td{padding:8px 12px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.cons-table tbody tr:hover td{background:#f8fafc}
.cons-table tbody tr:last-child td{border-bottom:none}
.status-badge{padding:3px 8px;border-radius:6px;font-size:9px;font-weight:700}
.st-np{background:#dcfce7;color:#16a34a}.st-at{background:#fef9c3;color:#a16207}.st-at2{background:#fee2e2;color:#dc2626}.st-cr{background:#fde8e4;color:#b04a38}
/* RELATÓRIO CLIENTE */
.rel-header{background:var(--navy);color:#fff;border-radius:11px;padding:20px 24px;margin-bottom:16px}
.rel-title{font-size:18px;font-weight:800;margin-bottom:4px}
.rel-sub{font-size:12px;color:rgba(255,255,255,.6)}
.rel-meta{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap}
.rel-meta-item{display:flex;flex-direction:column;gap:2px}
.rel-meta-label{font-size:9px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px}
.rel-meta-val{font-size:12px;font-weight:700}
.rel-section{background:#fff;border-radius:11px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.rel-section-title{font-weight:700;font-size:12px;color:var(--navy);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--green);text-transform:uppercase;letter-spacing:.5px}
.shortlist-card{display:flex;align-items:center;gap:12px;padding:10px;background:#f8fafc;border-radius:8px;margin-bottom:8px}
.sl-num{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0}
.sl-info{flex:1}
.sl-name{font-weight:700;font-size:12px}
.sl-sub{font-size:10px;color:var(--muted);margin-top:1px}
.sl-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.edit-mode .editable{background:#fffbeb;border:1px dashed #f59e0b;border-radius:4px;padding:2px 4px;cursor:text;outline:none}
.edit-mode .editable:focus{border-color:var(--blue);background:#eff6ff}
.edit-btn{padding:5px 12px;border-radius:7px;border:none;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.edit-btn.on{background:#fef3c7;color:#92400e}.edit-btn.save{background:var(--green);color:var(--navy)}
/* MODAL STATUS */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;display:none;align-items:center;justify-content:center}
.moverlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-weight:700;font-size:15px;color:var(--navy);margin-bottom:14px}
.modal select,.modal textarea{width:100%;padding:9px 12px;border:2px solid var(--border);border-radius:8px;font-family:'Montserrat',sans-serif;font-size:12px;outline:none;margin-bottom:10px}
.modal select:focus,.modal textarea:focus{border-color:var(--blue)}
.modal textarea{resize:none;min-height:70px}
.mbtns{display:flex;gap:7px;justify-content:flex-end}
.mcancel{padding:8px 16px;border-radius:7px;border:2px solid var(--border);background:#fff;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted)}
.msave{padding:8px 16px;border-radius:7px;border:none;background:var(--navy);color:#fff;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;cursor:pointer}
.msave:hover{background:var(--blue)}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);font-size:12px;gap:8px}
.spinner{width:18px;height:18px;border:2px solid #e5e7eb;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:18px;right:18px;background:#2a2a2b;color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:600;z-index:300;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--green);color:var(--navy)}.toast.error{background:var(--pink);color:#fff}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:4px}
</style>
</head>
<body>
<div id="login">
  <div class="lbox">
    <div class="llogo">Effect <span>Pessoas</span></div>
    <div class="lsub">ATS Viewer — Acesso restrito</div>
    <input type="password" id="pwd" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')entrar()">
    <button onclick="entrar()">Entrar</button>
    <div class="lerr" id="lerr">Senha incorreta.</div>
  </div>
</div>
<header>
  <div class="hlogo">Effect <span>ATS</span></div>
  <div class="htabs">
    <button class="htab active" onclick="irPara('dashboard',this)">📊 Dashboard</button>
    <button class="htab" onclick="irPara('candidatos',this)">👥 Candidatos</button>
    <button class="htab" onclick="irPara('vagas',this)">📋 Vagas</button>
    <button class="htab" onclick="irPara('conversas',this)">💬 Conversas</button>
    <button class="htab" onclick="irPara('indicadores',this)">📈 Indicadores</button>
    <button class="htab" onclick="irPara('funil',this)">🔽 Funil por Vaga</button>
    <button class="htab" onclick="irPara('consolidado',this)">🏢 Consolidado</button>
    <button class="htab" onclick="irPara('relatorio',this)">📄 Relatório Cliente</button>
    <button class="htab" onclick="irPara('banco-talentos',this)">🏆 Banco de Talentos</button>
  </div>
  <div class="hright">
    <span class="upd" id="upd"></span>
    <button class="rbtn" onclick="carregarTudo()">⟳</button>
    <a href="/inbox" style="padding:6px 14px;background:#8ed1b2;color:#1a2a4a;border-radius:7px;font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;text-decoration:none">← Lia</a>
  </div>
</header>
<div class="content">
  <!-- DASHBOARD -->
  <div class="page active" id="page-dashboard">
    <div class="sbar" id="db-stats"></div>
    <div class="dash-grid" id="db-charts"></div>
  </div>
  <!-- CANDIDATOS -->
  <div class="page" id="page-candidatos">
    <div class="fbar">
      <input class="fi" placeholder="🔍 Nome, telefone ou vaga..." oninput="filtrarC(this.value)">
      <button class="fc on" onclick="setFC(this,'')">Todos</button>
      <button class="fc" onclick="setFC(this,'Excelente')">⭐ Excelente</button>
      <button class="fc" onclick="setFC(this,'Bom')">✅ Bom</button>
      <button class="fc" onclick="setFC(this,'Regular')">Regular</button>
      <button class="fc" onclick="setFC(this,'Reprovado')">Reprovado</button>
      <button class="fc" id="fc-int" onclick="toggleInt()">✓ Interessados</button>
    </div>
    <div class="cgrid" id="cand-grid"></div>
  </div>
  <!-- VAGAS -->
  <div class="page" id="page-vagas">
    <div class="fbar">
      <input class="fi" placeholder="🔍 Cargo, cliente ou cidade..." oninput="filtrarV(this.value)">
      <button class="fc on" onclick="setFV(this,'todas')">Todas</button>
      <button class="fc" onclick="setFV(this,'ativas')">🟢 Abertas</button>
      <button class="fc" onclick="setFV(this,'encerradas')">Encerradas</button>
    </div>
    <div class="vgrid" id="vagas-grid"></div>
  </div>
  <!-- CONVERSAS -->
  <div class="page" id="page-conversas">
    <div class="fbar">
      <input class="fi" placeholder="🔍 Nome, telefone ou mensagem..." oninput="filtrarConv(this.value)">
      <button class="fc on" onclick="setFConv(this,'todas')">Todas</button>
      <button class="fc" onclick="setFConv(this,'user')">👤 Candidato</button>
      <button class="fc" onclick="setFConv(this,'assistant')">🤖 Lia</button>
      <button class="fc" onclick="setFConv(this,'manual')">✍️ Manual</button>
    </div>
    <div class="conv-table" id="conv-wrap"></div>
  </div>
  <!-- INDICADORES -->
  <div class="page" id="page-indicadores">

  </div>
  <!-- FUNIL POR VAGA -->
  <div class="page" id="page-funil">
    <div class="fbar">
      <select class="fi" id="funil-select" onchange="renderFunil()" style="min-width:240px">
        <option value="">Selecione uma vaga...</option>
      </select>

  <!-- CONSOLIDADO -->
  <div class="page" id="page-consolidado">
    <div class="fbar">
      <input class="fi" placeholder="🔍 Filtrar por cliente ou cargo..." oninput="filtrarCons(this.value)">
      <button class="fc on" onclick="setFCons(this,'todos')">Todos</button>
      <button class="fc" onclick="setFCons(this,'atencao')">⚠️ Atenção</button>
      <button class="fc" onclick="setFCons(this,'atrasada')">🔴 Atrasada</button>
      <button class="fc" onclick="setFCons(this,'critica')">🚨 Crítica</button>
    </div>
    <div class="sbar" id="cons-stats" style="margin-bottom:16px"></div>
    <div class="cons-table" id="cons-table"></div>

  <!-- BANCO DE TALENTOS -->
  <div class="page" id="page-banco-talentos">
    <div class="fbar">
      <input class="fi" placeholder="🔍 Nome, cargo ou cidade..." oninput="filtrarBT(this.value)" id="bt-busca">
      <button class="fc on" id="bt-fc-all" onclick="setBTFiltro(this,'')">Todos</button>
      <button class="fc" onclick="setBTFiltro(this,'DISC-D')">🔴 Dominante</button>
      <button class="fc" onclick="setBTFiltro(this,'DISC-I')">🟡 Influente</button>
      <button class="fc" onclick="setBTFiltro(this,'DISC-S')">🟢 Estável</button>
      <button class="fc" onclick="setBTFiltro(this,'DISC-C')">🔵 Cauteloso</button>
    </div>
    <div class="sbar" id="bt-stats" style="margin-bottom:16px"></div>
    <div class="cgrid" id="bt-grid"></div>
  </div>
  <!-- RELATÓRIO CLIENTE -->
  <div class="page" id="page-relatorio">
    <div class="fbar" style="margin-bottom:16px">
      <select class="fi" id="rel-select" onchange="renderRelatorio()" style="min-width:240px">
        <option value="">Selecione um cliente / vaga...</option>
      </select>
      <button class="edit-btn on" id="edit-btn" onclick="toggleEdit()">✏️ Modo edição</button>
      <button class="edit-btn save" id="save-btn" style="display:none" onclick="salvarEdicao()">💾 Salvar versão</button>
    </div>
    <div id="rel-content"></div>
  </div>
</div>
<!-- MODAL STATUS -->
<div class="moverlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">Atualizar candidato</h3>
    <select id="modal-status">
      <option value="">Manter status atual</option>
      <option>Interessado</option>
      <option>Analisado pela Lia</option>
      <option>Em processo</option>
      <option>Entrevista agendada</option>
      <option>Aprovado</option>
      <option>Reprovado</option>
    </select>
    <textarea id="modal-obs" placeholder="Adicionar observação (opcional)..."></textarea>
    <div class="mbtns">
      <button class="mcancel" onclick="fecharModal()">Cancelar</button>
      <button class="msave" onclick="salvarStatus()">Salvar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SENHA = "effect2026";
(function autoLogin(){
  try{
    const saved=localStorage.getItem('effect_saved_pwd');
    if(saved){const pwd=atob(saved);if(pwd===SENHA){document.getElementById('login').classList.add('hidden');carregarTudo();setInterval(carregarTudo,30000);return;}}
  }catch(e){}
})();
const API = window.location.origin;
let candidatos=[], vagas=[], sessoes={}, convRows=[], talentos=[];
let fClass='', fInt=false, fVaga='todas', fConvTab='todas', fConvBusca='';
let fCandBusca='', fVagaBusca='', fConsBusca='', fConsTab='todos';
let btBusca='', btDisc='';
let modalTel=null, editMode=false;
let relData={}, funilData={};

function entrar(){
  if(document.getElementById('pwd').value===SENHA){
    document.getElementById('login').classList.add('hidden');
    carregarTudo();
    setInterval(carregarTudo,30000);
  } else {
    document.getElementById('lerr').style.display='block';
  }
}
function irPara(pg,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.htab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+pg).classList.add('active');
  if(el) el.classList.add('active');
  renderPagina(pg);
}
function renderPagina(pg){
  if(pg==='dashboard') renderDashboard();
  else if(pg==='candidatos') renderCandidatos();
  else if(pg==='vagas') renderVagas();
  else if(pg==='conversas') renderConversas();
  else if(pg==='indicadores') renderIndicadores();
  else if(pg==='funil') renderFunil();
  else if(pg==='consolidado') renderConsolidado();
  else if(pg==='relatorio') renderRelatorio();
  else if(pg==='banco-talentos') renderBancoTalentos();
}
async function carregarTudo(){
  try{
    const [rC,rV,rS,rBT] = await Promise.all([
      fetch(API+'/sheets/candidatos').then(r=>r.json()).catch(()=>({candidatos:[]})),
      fetch(API+'/sheets/vagas').then(r=>r.json()).catch(()=>({vagas:[]})),
      fetch(API+'/inbox/sessoes').then(r=>r.json()).catch(()=>({sessoes:{}})),
      fetch(API+'/sheets/banco-talentos').then(r=>r.json()).catch(()=>({talentos:[]}))
    ]);
    candidatos = rC.candidatos||[];
    vagas = rV.vagas||[];
    sessoes = rS.sessoes||{};
    talentos = rBT.talentos||[];
    convRows=[];
    Object.entries(sessoes).forEach(function(entry){
      var tel=entry[0], s=entry[1];
      (s.historico||[]).forEach(function(msg){
        convRows.push({tel:tel,nome:s.nome||tel,role:msg.role||'',mensagem:msg.content||'',horario:msg.timestamp||'',modo:s.modo||'automatico',pausado:s.pausado});
      });
    });
    document.getElementById('upd').textContent='Atualizado: '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    var pg = document.querySelector('.page.active');
    if(pg) renderPagina(pg.id.replace('page-',''));
    popularSelects();
  } catch(e){console.error(e)}
}
function popularSelects(){
  var sel = document.getElementById('funil-select');
  var selR = document.getElementById('rel-select');
  var vagasAtivas = vagas.filter(function(v){return v.cargo});
  sel.innerHTML = '<option value="">Selecione uma vaga...</option>' + vagasAtivas.map(function(v){return '<option value="'+(v.idVaga||v.cargo)+'">'+v.cargo+' — '+(v.cliente||'')+'</option>';}).join('');
  selR.innerHTML = '<option value="">Selecione um cliente / vaga...</option>' + vagasAtivas.map(function(v){return '<option value="'+(v.idVaga||v.cargo)+'">'+(v.cliente||'')+' — '+v.cargo+'</option>';}).join('');
}

// ── DASHBOARD ──
function renderDashboard(){
  var total=candidatos.length;
  var exc=candidatos.filter(function(c){return c['Classificação']==='Excelente'}).length;
  var bons=candidatos.filter(function(c){return c['Classificação']==='Bom'}).length;
  var reg=candidatos.filter(function(c){return c['Classificação']==='Regular'}).length;
  var rep=candidatos.filter(function(c){return c['Classificação']==='Reprovado'}).length;
  var int=candidatos.filter(function(c){return c['Status']==='Interessado'}).length;
  var cur=candidatos.filter(function(c){return c['Currículo']==='Sim'}).length;
  var va=vagas.filter(function(v){return !['inativa','fechada','cancelada','encerrada'].includes((v.status||'').toLowerCase())}).length;
  var conv=Object.keys(sessoes).length;
  var scores=candidatos.map(function(c){return Number(c['Score Geral']||0)}).filter(function(s){return s>0});
  var scoreMed=scores.length?Math.round(scores.reduce(function(a,b){return a+b})/scores.length):0;
  document.getElementById('db-stats').innerHTML=
    '<div class="scard blue"><div class="snum">'+total+'</div><div class="slabel">Candidatos</div></div>'+
    '<div class="scard yellow"><div class="snum" style="color:#f59e0b">'+exc+'</div><div class="slabel">Excelentes</div></div>'+
    '<div class="scard green"><div class="snum" style="color:#16a34a">'+int+'</div><div class="slabel">Interessados</div></div>'+
    '<div class="scard navy"><div class="snum">'+cur+'</div><div class="slabel">Com Currículo</div></div>'+
    '<div class="scard"><div class="snum">'+va+'</div><div class="slabel">Vagas Ativas</div></div>'+
    '<div class="scard blue"><div class="snum" style="color:var(--blue)">'+conv+'</div><div class="slabel">Conversas Lia</div></div>'+
    '<div class="scard"><div class="snum">'+(scoreMed||'—')+'</div><div class="slabel">Score Médio</div></div>'+
    '<div class="scard red"><div class="snum" style="color:#dc2626">'+rep+'</div><div class="slabel">Reprovados</div></div>';
  var pV={};candidatos.forEach(function(c){var v=c['Vaga de Interesse']||'Sem vaga';if(!pV[v])pV[v]=0;pV[v]++;});
  var vR=Object.entries(pV).sort(function(a,b){return b[1]-a[1]});var mxV=Math.max.apply(null,vR.map(function(x){return x[1]}).concat([1]));
  var pC={};candidatos.forEach(function(c){var ci=(c['Cidade / Estado']||'N/A').split('/')[0].trim();pC[ci]=(pC[ci]||0)+1;});
  var cR=Object.entries(pC).sort(function(a,b){return b[1]-a[1]}).slice(0,8);var mxC=Math.max.apply(null,cR.map(function(x){return x[1]}).concat([1]));
  document.getElementById('db-charts').innerHTML=
    '<div class="dbox full"><div class="dbox-title">Classificação Geral</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+
    [['Excelente','#f59e0b',exc],['Bom','#8ed1b2',bons],['Regular','#facc15',reg],['Reprovado','#f4afa1',rep]].map(function(item){
      return '<div style="flex:1;min-width:100px;background:#f8fafc;border-radius:9px;padding:13px;text-align:center;border-top:3px solid '+item[1]+'"><div style="font-size:22px;font-weight:800;color:var(--navy)">'+item[2]+'</div><div style="font-size:9px;color:var(--muted);margin-top:2px;text-transform:uppercase">'+item[0]+'</div><div style="font-size:10px;font-weight:700;color:'+item[1]+';margin-top:3px">'+(total?Math.round(item[2]/total*100):0)+'%</div></div>';
    }).join('')+'</div></div>'+
    '<div class="dbox"><div class="dbox-title">Candidatos por Vaga</div>'+
    (vR.map(function(item){var p=Math.round(item[1]/mxV*100);return '<div class="brow"><div class="blabel" title="'+item[0]+'">'+item[0].slice(0,20)+'</div><div class="btrack"><div class="bfill" style="width:'+p+'%;background:var(--blue)"></div></div><div class="bval">'+item[1]+'</div></div>';}).join('')||'<div class="empty">Sem dados</div>')+
    '</div><div class="dbox"><div class="dbox-title">Candidatos por Cidade</div>'+
    (cR.map(function(item){var p=Math.round(item[1]/mxC*100);return '<div class="brow"><div class="blabel">'+item[0]+'</div><div class="btrack"><div class="bfill" style="width:'+p+'%;background:var(--green)"></div></div><div class="bval">'+item[1]+'</div></div>';}).join('')||'<div class="empty">Sem dados</div>')+
    '</div>';
}

// ── CANDIDATOS ──
function renderCandidatos(){
  var filtered=candidatos.filter(function(c){
    var b=fCandBusca.toLowerCase();
    return(!b||(c['Nome']||'').toLowerCase().includes(b)||(c['Telefone']||'').includes(b)||(c['Vaga de Interesse']||'').toLowerCase().includes(b))
      &&(!fClass||c['Classificação']===fClass)
      &&(!fInt||c['Status']==='Interessado');
  });
  var g=document.getElementById('cand-grid');
  if(!filtered.length){g.innerHTML='<div class="empty">Nenhum candidato encontrado.</div>';return}
  g.innerHTML=filtered.map(function(c){
    var cls=(c['Classificação']||'').toLowerCase();
    var score=Number(c['Score Geral']||c['Score da Vaga']||0);
    var nome=c['Nome']||'—';
    var tel=(c['Telefone']||'').replace(/\D/g,'');
    var ck=['excelente','bom','regular','reprovado'].includes(cls)?cls:'default';
    var sk=score>=80?'sa':score>=60?'sm':score>0?'sb':'sz';
    var sbdg='cls'+(ck==='excelente'?'e':ck==='bom'?'b':ck==='regular'?'r':ck==='reprovado'?'rp':'d');
    var st=(function(){var s=(c['Status']||'').toLowerCase();if(s.includes('interessado'))return '<span class="chip cg">✓ Interessado</span>';if(s.includes('analisado'))return '<span class="chip cb">🤖 Lia</span>';if(s.includes('reprovado'))return '<span class="chip cr">✗ Reprovado</span>';return c['Status']?'<span class="chip cm">'+c['Status']+'</span>':''})();
    var chips=[];
    if(c['Transporte Próprio']==='Sim')chips.push('<span class="chip cn">🚗</span>');
    if(c['CLT Imediato']==='Sim')chips.push('<span class="chip cn">📄 CLT</span>');
    if(c['Currículo']==='Sim')chips.push('<span class="chip cg">📎</span>');
    return '<div class="ccard">'+
      '<div class="ctop '+ck+'">'+
        '<div class="cav '+ck+'">'+nome.charAt(0).toUpperCase()+'</div>'+
        '<div class="chi">'+
          '<div class="cname">'+nome+'</div>'+
          '<div class="csub">'+(c['Cidade / Estado']?'<span>📍'+c['Cidade / Estado']+'</span>':'')+'<span class="clsbdg '+sbdg+'">'+(c['Classificação']||'—')+'</span></div>'+
        '</div>'+
        '<div class="sc '+sk+'">'+(score||'—')+'</div>'+
      '</div>'+
      '<div class="cbody">'+
        (c['Vaga de Interesse']?'<div class="vtag">💼 '+c['Vaga de Interesse']+'</div>':'')+
        '<div class="cchips">'+st+chips.join('')+'</div>'+
        (c['Pontos Fortes']?'<div class="pf">💡 '+c['Pontos Fortes'].slice(0,100)+(c['Pontos Fortes'].length>100?'…':'')+'</div>':'')+
        (c['Pontos de Atenção']?'<div style="font-size:9px;color:#888">⚠️ '+c['Pontos de Atenção'].slice(0,80)+'</div>':'')+
      '</div>'+
      '<div class="cfoot">'+
        '<span class="cdate">'+(c['Criado em']||'')+'</span>'+
        '<div class="cacts">'+
          '<button class="abtn st" onclick="abrirModal(\''+tel+'\',\''+nome.replace(/'/g,"\\'")+'\'">✏️</button>'+
          (tel?'<button class="abtn wa" onclick="window.open(\'https://wa.me/'+tel+'\',\'_blank\')">💬</button>':'')+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}
function filtrarC(v){fCandBusca=v;renderCandidatos()}
function setFC(el,v){fClass=v;document.querySelectorAll('#page-candidatos .fc').forEach(function(c){c.classList.remove('on')});el.classList.add('on');renderCandidatos()}
function toggleInt(){fInt=!fInt;document.getElementById('fc-int').classList.toggle('on',fInt);renderCandidatos()}

// ── VAGAS ──
function renderVagas(){
  var b=fVagaBusca.toLowerCase();
  var filtered=vagas.filter(function(v){
    var enc=['inativa','fechada','cancelada','encerrada'].includes((v.status||'').toLowerCase());
    if(fVaga==='ativas'&&enc)return false;
    if(fVaga==='encerradas'&&!enc)return false;
    return !b||(v.cargo||'').toLowerCase().includes(b)||(v.cliente||'').toLowerCase().includes(b)||(v.cidade||'').toLowerCase().includes(b);
  });
  var g=document.getElementById('vagas-grid');
  if(!filtered.length){g.innerHTML='<div class="empty">Nenhuma vaga encontrada.</div>';return}
  g.innerHTML=filtered.map(function(v){
    var enc=['inativa','fechada','cancelada','encerrada'].includes((v.status||'').toLowerCase());
    var candCount=candidatos.filter(function(c){return (c['Vaga de Interesse']||'')===(v.cargo||'')}).length;
    return '<div class="vcard '+(enc?'enc':'')+'">'+
      '<div><div class="vtit">'+(v.cargo||'—')+'</div><div class="vcli">'+(v.cliente||'—')+'</div></div>'+
      '<div class="vrows">'+
        (v.cidade?'<div class="vrow"><span class="vico">📍</span>'+v.cidade+'</div>':'')+
        (v.salario?'<div class="vrow"><span class="vico">💰</span>'+v.salario+'</div>':'')+
        (v.modelo?'<div class="vrow"><span class="vico">🏠</span>'+v.modelo+'</div>':'')+
        (v.abertura?'<div class="vrow"><span class="vico">📅</span>Abertura: '+v.abertura+'</div>':'')+
        (v.prazo?'<div class="vrow"><span class="vico">⏰</span>Prazo: '+v.prazo+'</div>':'')+
      '</div>'+
      '<div class="vfoot">'+
        '<span class="chip '+(enc?'cm':'cb')+'">'+(enc?'Encerrada':'Aberta')+'</span>'+
        (candCount?'<span class="chip cn">👥 '+candCount+' cand.</span>':'')+
        (v.vagas?'<span class="chip cn">'+v.vagas+' vaga(s)</span>':'')+
      '</div>'+
    '</div>';
  }).join('');
}
function filtrarV(v){fVagaBusca=v;renderVagas()}
function setFV(el,v){fVaga=v;document.querySelectorAll('#page-vagas .fc').forEach(function(c){c.classList.remove('on')});el.classList.add('on');renderVagas()}

// ── CONVERSAS ──
function renderConversas(){
  var b=fConvBusca.toLowerCase();
  var filtered=convRows.filter(function(r){
    if(fConvTab==='user'&&r.role!=='user')return false;
    if(fConvTab==='assistant'&&r.role!=='assistant')return false;
    if(fConvTab==='manual'&&r.modo!=='manual')return false;
    return !b||(r.nome||'').toLowerCase().includes(b)||(r.tel||'').includes(b)||(r.mensagem||'').toLowerCase().includes(b);
  });
  var wrap=document.getElementById('conv-wrap');
  if(!filtered.length){wrap.innerHTML='<div class="empty">Nenhuma conversa encontrada.</div>';return}
  wrap.innerHTML='<table><thead><tr><th>Nome</th><th>Telefone</th><th>Papel</th><th class="msg-cell">Mensagem</th><th>Horário</th><th>Modo</th></tr></thead><tbody>'+
    filtered.slice(0,200).map(function(r){
      var ts='';
      try{ts=r.horario?new Date(r.horario).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';}catch(e){}
      return '<tr>'+
        '<td>'+(r.nome||'—')+'</td>'+
        '<td>'+(r.tel||'—')+'</td>'+
        '<td><span class="'+(r.role==='user'?'role-user':'role-lia')+'">'+(r.role==='user'?'Candidato':'Lia')+'</span></td>'+
        '<td class="msg-cell" title="'+(r.mensagem||'').replace(/"/g,'&quot;')+'">'+(r.mensagem||'').slice(0,80)+((r.mensagem||'').length>80?'…':'')+'</td>'+
        '<td>'+ts+'</td>'+
        '<td><span class="chip '+(r.modo==='manual'?'cp':'cn')+'">'+(r.modo||'auto')+'</span></td>'+
      '</tr>';
    }).join('')+'</tbody></table>';
}
function filtrarConv(v){fConvBusca=v;renderConversas()}
function setFConv(el,v){fConvTab=v;document.querySelectorAll('#page-conversas .fc').forEach(function(c){c.classList.remove('on')});el.classList.add('on');renderConversas()}

// ── INDICADORES ──
function renderIndicadores(){
  var total=candidatos.length||1;
  var int=candidatos.filter(function(c){return c['Status']==='Interessado'}).length;
  var exc=candidatos.filter(function(c){return c['Classificação']==='Excelente'}).length;
  var bons=candidatos.filter(function(c){return c['Classificação']==='Bom'}).length;
  var cur=candidatos.filter(function(c){return c['Currículo']==='Sim'}).length;
  var conv=Object.keys(sessoes).length;
  var vagsAtivas=vagas.filter(function(v){return !['inativa','fechada','cancelada','encerrada'].includes((v.status||'').toLowerCase())}).length;
  var scores=candidatos.map(function(c){return Number(c['Score Geral']||0)}).filter(function(s){return s>0});
  var scoreM=scores.length?Math.round(scores.reduce(function(a,b){return a+b})/scores.length):0;
  var indicadores=[
    ['Total de Candidatos',total,'—','—','var(--blue)',100],
    ['Interessados',int,total,Math.round(int/total*100),'var(--green)',Math.round(int/total*100)],
    ['Excelentes',exc,total,Math.round(exc/total*100),'#f59e0b',Math.round(exc/total*100)],
    ['Bons',bons,total,Math.round(bons/total*100),'var(--green)',Math.round(bons/total*100)],
    ['Com Currículo',cur,total,Math.round(cur/total*100),'var(--navy)',Math.round(cur/total*100)],
    ['Conversas Lia',conv,total,'—','var(--blue)',Math.min(100,Math.round(conv/total*100))],
    ['Score Médio',scoreM+'pts','—','—','var(--blue)',scoreM],
    ['Vagas Ativas',vagsAtivas,vagas.length,'—','var(--blue)',vagas.length?Math.round(vagsAtivas/vagas.length*100):0]
  ];
  var acc={};
  candidatos.forEach(function(c){
    var v=c['Vaga de Interesse']||'Sem vaga';
    if(!acc[v])acc[v]={tot:0,exc:0,int:0};
    acc[v].tot++;
    if(c['Classificação']==='Excelente')acc[v].exc++;
    if(c['Status']==='Interessado')acc[v].int++;
  });
  document.getElementById('ind-content').innerHTML=
    '<div class="ind-table" style="margin-bottom:16px"><table><thead><tr><th>Indicador</th><th>Valor</th><th>Base</th><th>%</th><th style="min-width:160px">Barra</th></tr></thead><tbody>'+
    indicadores.map(function(row){
      return '<tr><td>'+row[0]+'</td><td class="ind-val">'+row[1]+'</td><td class="ind-meta">'+row[2]+'</td><td class="ind-val">'+(typeof row[3]==='number'?row[3]+'%':row[3])+'</td>'+
        '<td><div class="pct-bar"><div class="pct-track" style="flex:1"><div class="pct-fill" style="width:'+row[5]+'%;background:'+row[4]+'"></div></div></div></td></tr>';
    }).join('')+'</tbody></table></div>'+
    '<div class="ind-table"><table><thead><tr><th>Vaga</th><th>Candidatos</th><th>Excelentes</th><th>Interessados</th><th>Taxa</th></tr></thead><tbody>'+
    Object.entries(acc).sort(function(a,b){return b[1].tot-a[1].tot}).map(function(entry){
      var v=entry[0], d=entry[1];
      return '<tr><td>'+v+'</td><td class="ind-val">'+d.tot+'</td><td>'+(d.exc?'<span class="chip cy">'+d.exc+'</span>':'-')+'</td><td>'+(d.int?'<span class="chip cg">'+d.int+'</span>':'-')+'</td><td class="ind-meta">'+(d.tot?Math.round(d.int/d.tot*100):0)+'%</td></tr>';
    }).join('')+'</tbody></table></div>';
}

// ── FUNIL ──
function renderFunil(){
  var sel=document.getElementById('funil-select').value;
  var fc=document.getElementById('funil-content');
  if(!sel){fc.innerHTML='<div class="empty">Selecione uma vaga para ver o funil.</div>';return}
  var vaga=vagas.find(function(v){return (v.idVaga||v.cargo)===sel})||{};
  var vagaCargo=vaga.cargo||sel;
  var cands=candidatos.filter(function(c){return (c['Vaga de Interesse']||'')===vagaCargo||(c['idVaga']||'')===sel});
  var total=cands.length||1;
  var etapas=[
    {nome:'Captados',icon:'📥',filter:function(){return true}},
    {nome:'Analisados pela Lia',icon:'🤖',filter:function(c){return (c['Status']||'').includes('Analisado')}},
    {nome:'Interessados',icon:'✅',filter:function(c){return c['Status']==='Interessado'}},
    {nome:'Em Processo',icon:'🔄',filter:function(c){return c['Status']==='Em processo'}},
    {nome:'Entrevista Agendada',icon:'📅',filter:function(c){return c['Status']==='Entrevista agendada'}},
    {nome:'Aprovados',icon:'🏆',filter:function(c){return c['Status']==='Aprovado'}}
  ];
  fc.innerHTML='<div style="margin-bottom:12px;font-size:11px;color:var(--muted)">'+cands.length+' candidato(s) nesta vaga</div>'+
    '<div class="funil-wrap">'+
    etapas.map(function(e){
      var n=cands.filter(e.filter).length;
      var pct=Math.round(n/total*100);
      return '<div class="funil-et">'+
        '<div class="funil-icon">'+e.icon+'</div>'+
        '<div class="funil-info"><div class="funil-name">'+e.nome+'</div><div class="funil-sub">'+pct+'% do total</div></div>'+
        '<div class="funil-bar-wrap"><div class="funil-bar-track"><div class="funil-bar-fill" style="width:'+pct+'%;background:var(--blue)"></div></div></div>'+
        '<div class="funil-num">'+n+'</div>'+
        '<div class="funil-pct">'+pct+'%</div>'+
      '</div>';
    }).join('')+'</div>';
}

// ── CONSOLIDADO ──
function renderConsolidado(){
  var b=fConsBusca.toLowerCase();
  var rows=vagas.filter(function(v){
    if(!b)return true;
    return (v.cargo||'').toLowerCase().includes(b)||(v.cliente||'').toLowerCase().includes(b);
  }).map(function(v){
    var cVaga=candidatos.filter(function(c){return (c['Vaga de Interesse']||'')===(v.cargo||'')});
    var int=cVaga.filter(function(c){return c['Status']==='Interessado'}).length;
    var apr=cVaga.filter(function(c){return c['Status']==='Aprovado'}).length;
    var enc=['inativa','fechada','cancelada','encerrada'].includes((v.status||'').toLowerCase());
    var dias=null;
    if(v.abertura){try{dias=Math.round((Date.now()-new Date(v.abertura))/(1000*60*60*24))}catch(e){}}
    var alert='np';
    if(!enc){
      if(cVaga.length<3)alert='cr';
      else if(dias&&dias>30)alert='at2';
      else if(dias&&dias>20)alert='at';
    }
    if(fConsTab==='atencao'&&!['at','at2'].includes(alert))return null;
    if(fConsTab==='atrasada'&&alert!=='at2')return null;
    if(fConsTab==='critica'&&alert!=='cr')return null;
    return {v:v,cnt:cVaga.length,int:int,apr:apr,enc:enc,dias:dias,alert:alert};
  }).filter(Boolean);
  var ativas=vagas.filter(function(v){return !['inativa','fechada','cancelada','encerrada'].includes((v.status||'').toLowerCase())}).length;
  var criticas=rows.filter(function(r){return r.alert==='cr'}).length;
  var ok=rows.filter(function(r){return r.alert==='np'}).length;
  document.getElementById('cons-stats').innerHTML=
    '<div class="scard blue"><div class="snum">'+vagas.length+'</div><div class="slabel">Total Vagas</div></div>'+
    '<div class="scard green"><div class="snum" style="color:#16a34a">'+ativas+'</div><div class="slabel">Ativas</div></div>'+
    '<div class="scard red"><div class="snum" style="color:#dc2626">'+criticas+'</div><div class="slabel">Críticas</div></div>'+
    '<div class="scard"><div class="snum">'+ok+'</div><div class="slabel">No prazo</div></div>';
  var t=document.getElementById('cons-table');
  if(!rows.length){t.innerHTML='<div class="empty">Nenhuma vaga encontrada.</div>';return}
  var alertMap={np:'<span class="status-badge st-np">✓ OK</span>',at:'<span class="status-badge st-at">⚠️ Atenção</span>',at2:'<span class="status-badge st-at2">🔴 Atrasada</span>',cr:'<span class="status-badge st-cr">🚨 Crítica</span>'};
  t.innerHTML='<table><thead><tr><th>Cargo</th><th>Cliente</th><th>Cidade</th><th>Status</th><th>Candidatos</th><th>Interessados</th><th>Aprovados</th><th>Dias</th><th>Alerta</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr>'+
        '<td style="font-weight:700">'+(r.v.cargo||'—')+'</td>'+
        '<td>'+(r.v.cliente||'—')+'</td>'+
        '<td>'+(r.v.cidade||'—')+'</td>'+
        '<td><span class="chip '+(r.enc?'cm':'cg')+'">'+(r.enc?'Encerrada':'Aberta')+'</span></td>'+
        '<td>'+r.cnt+'</td>'+
        '<td>'+(r.int?'<span class="chip cg">'+r.int+'</span>':'-')+'</td>'+
        '<td>'+(r.apr?'<span class="chip cb">'+r.apr+'</span>':'-')+'</td>'+
        '<td>'+(r.dias!=null?r.dias+'d':'—')+'</td>'+
        '<td>'+(alertMap[r.alert]||'')+'</td>'+
      '</tr>';
    }).join('')+'</tbody></table>';
}
function filtrarCons(v){fConsBusca=v;renderConsolidado()}
function setFCons(el,v){fConsTab=v;document.querySelectorAll('#page-consolidado .fc').forEach(function(c){c.classList.remove('on')});el.classList.add('on');renderConsolidado()}

// ── RELATÓRIO CLIENTE ──
function renderRelatorio(){
  var sel=document.getElementById('rel-select').value;
  var rc=document.getElementById('rel-content');
  if(!sel){rc.innerHTML='<div class="empty">Selecione um cliente/vaga para gerar o relatório.</div>';return}
  var vaga=vagas.find(function(v){return (v.idVaga||v.cargo)===sel})||{};
  var vagaCargo=vaga.cargo||sel;
  var cands=candidatos.filter(function(c){return (c['Vaga de Interesse']||'')===vagaCargo});
  var shortlist=cands.filter(function(c){return ['Excelente','Bom'].includes(c['Classificação'])}).slice(0,10);
  var hoje=new Date().toLocaleDateString('pt-BR');
  rc.innerHTML=
    '<div class="rel-header">'+
      '<div class="rel-title"><span class="editable" contenteditable="false">'+(vaga.cargo||'Vaga')+'</span></div>'+
      '<div class="rel-sub">Relatório de Recrutamento • Effect Pessoas</div>'+
      '<div class="rel-meta">'+
        '<div class="rel-meta-item"><div class="rel-meta-label">Cliente</div><div class="rel-meta-val"><span class="editable" contenteditable="false">'+(vaga.cliente||'—')+'</span></div></div>'+
        '<div class="rel-meta-item"><div class="rel-meta-label">Data</div><div class="rel-meta-val">'+hoje+'</div></div>'+
        '<div class="rel-meta-item"><div class="rel-meta-label">Cidade</div><div class="rel-meta-val">'+(vaga.cidade||'—')+'</div></div>'+
        '<div class="rel-meta-item"><div class="rel-meta-label">Candidatos Analisados</div><div class="rel-meta-val">'+cands.length+'</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="rel-section">'+
      '<div class="rel-section-title">Shortlist — Candidatos Recomendados</div>'+
      (shortlist.length?shortlist.map(function(c,i){
        var score=Number(c['Score Geral']||c['Score da Vaga']||0);
        var sk=score>=80?'sa':score>=60?'sm':score>0?'sb':'sz';
        return '<div class="shortlist-card">'+
          '<div class="sl-num">'+(i+1)+'</div>'+
          '<div class="sl-info">'+
            '<div class="sl-name">'+(c['Nome']||'—')+'</div>'+
            '<div class="sl-sub">'+(c['Cidade / Estado']||'')+(c['Status']?' • '+c['Status']:'')+'</div>'+
            '<div class="sl-chips">'+
              '<span class="chip '+(c['Classificação']==='Excelente'?'cy':'cg')+'">'+(c['Classificação']||'—')+'</span>'+
              (c['Currículo']==='Sim'?'<span class="chip cg">📎 Currículo</span>':'')+
              (c['CLT Imediato']==='Sim'?'<span class="chip cn">📄 CLT</span>':'')+
              (c['Transporte Próprio']==='Sim'?'<span class="chip cn">🚗 Transp.</span>':'')+
            '</div>'+
          '</div>'+
          '<div class="sc '+sk+'" style="width:40px;height:40px;font-size:12px">'+(score||'—')+'</div>'+
        '</div>';
      }).join(''):'<div class="empty">Nenhum candidato qualificado encontrado.</div>')+
    '</div>'+
    '<div class="rel-section">'+
      '<div class="rel-section-title">Observações</div>'+
      '<div class="editable" contenteditable="false" style="min-height:60px;font-size:12px;line-height:1.6;color:#555">Clique em "Modo edição" para adicionar observações personalizadas.</div>'+
    '</div>';
}
function toggleEdit(){
  editMode=!editMode;
  document.getElementById('rel-content').classList.toggle('edit-mode',editMode);
  document.querySelectorAll('.editable').forEach(function(el){el.contentEditable=editMode?'true':'false'});
  document.getElementById('edit-btn').textContent=editMode?'✏️ Editando...':'✏️ Modo edição';
  document.getElementById('edit-btn').classList.toggle('on',!editMode);
  document.getElementById('save-btn').style.display=editMode?'inline-block':'none';
}
function salvarEdicao(){
  toggleEdit();
  mostrarToast('Versão salva com sucesso!','success');
}

// ── BANCO DE TALENTOS ──
function renderBancoTalentos(){
  var b=btBusca.toLowerCase();
  var filtered=talentos.filter(function(t){
    if(btDisc&&!(t['Perfil DISC']||'').includes(btDisc.replace('DISC-','')))return false;
    return !b||(t['Nome']||'').toLowerCase().includes(b)||(t['Vaga de Interesse']||'').toLowerCase().includes(b)||(t['Cidade / Estado']||'').toLowerCase().includes(b);
  });
  var discCount={D:0,I:0,S:0,C:0};
  talentos.forEach(function(t){
    var d=t['Perfil DISC']||'';
    ['D','I','S','C'].forEach(function(k){if(d.includes(k))discCount[k]++});
  });
  document.getElementById('bt-stats').innerHTML=
    '<div class="scard navy"><div class="snum">'+talentos.length+'</div><div class="slabel">Total Talentos</div></div>'+
    '<div class="scard red"><div class="snum" style="color:#dc2626">'+discCount.D+'</div><div class="slabel">Dominante</div></div>'+
    '<div class="scard yellow"><div class="snum" style="color:#a16207">'+discCount.I+'</div><div class="slabel">Influente</div></div>'+
    '<div class="scard green"><div class="snum" style="color:#16a34a">'+discCount.S+'</div><div class="slabel">Estável</div></div>'+
    '<div class="scard blue"><div class="snum" style="color:var(--blue)">'+discCount.C+'</div><div class="slabel">Cauteloso</div></div>';
  var g=document.getElementById('bt-grid');
  if(!filtered.length){g.innerHTML='<div class="empty">Nenhum talento encontrado.</div>';return}
  g.innerHTML=filtered.map(function(c){
    var cls=(c['Classificação']||'').toLowerCase();
    var score=Number(c['Score Geral']||0);
    var nome=c['Nome']||'—';
    var tel=(c['Telefone']||'').replace(/\D/g,'');
    var ck=['excelente','bom','regular','reprovado'].includes(cls)?cls:'default';
    var sk=score>=80?'sa':score>=60?'sm':score>0?'sb':'sz';
    var disc=c['Perfil DISC']||'';
    var discCls=disc.includes('D')?'cr':disc.includes('I')?'cy':disc.includes('S')?'cg':'cb';
    return '<div class="ccard">'+
      '<div class="ctop '+ck+'">'+
        '<div class="cav '+ck+'">'+nome.charAt(0).toUpperCase()+'</div>'+
        '<div class="chi">'+
          '<div class="cname">'+nome+'</div>'+
          '<div class="csub">'+(c['Cidade / Estado']?'<span>📍'+c['Cidade / Estado']+'</span>':'')+(disc?'<span class="chip '+discCls+'">'+disc+'</span>':'')+'</div>'+
        '</div>'+
        '<div class="sc '+sk+'">'+(score||'—')+'</div>'+
      '</div>'+
      '<div class="cbody">'+
        (c['Vaga de Interesse']?'<div class="vtag">💼 '+c['Vaga de Interesse']+'</div>':'')+
        (c['Pontos Fortes']?'<div class="pf">💡 '+c['Pontos Fortes'].slice(0,100)+(c['Pontos Fortes'].length>100?'…':'')+'</div>':'')+
      '</div>'+
      '<div class="cfoot">'+
        '<span class="cdate">'+(c['Criado em']||'')+'</span>'+
        '<div class="cacts">'+(tel?'<button class="abtn wa" onclick="window.open(\'https://wa.me/'+tel+'\',\'_blank\')">💬</button>':'')+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}
function filtrarBT(v){btBusca=v;renderBancoTalentos()}
function setBTFiltro(el,v){btDisc=v;document.querySelectorAll('#page-banco-talentos .fc').forEach(function(c){c.classList.remove('on')});el.classList.add('on');renderBancoTalentos()}

// ── MODAL STATUS ──
function abrirModal(tel,nome){
  modalTel=tel;
  document.getElementById('modal-title').textContent='Atualizar: '+nome;
  document.getElementById('modal-status').value='';
  document.getElementById('modal-obs').value='';
  document.getElementById('modal').classList.add('show');
}
function fecharModal(){
  document.getElementById('modal').classList.remove('show');
  modalTel=null;
}
async function salvarStatus(){
  if(!modalTel)return;
  var status=document.getElementById('modal-status').value;
  var obs=document.getElementById('modal-obs').value;
  try{
    await fetch(API+'/sheets/candidatos/'+modalTel+'/status',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({status:status,observacao:obs})
    });
    fecharModal();
    mostrarToast('Candidato atualizado!','success');
    carregarTudo();
  } catch(e){
    mostrarToast('Erro ao salvar. Tente novamente.','error');
  }
}
function mostrarToast(msg,tipo){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast'+(tipo?' '+tipo:'');
  setTimeout(function(){t.classList.add('show')},10);
  setTimeout(function(){t.classList.remove('show')},3000);
}
</script>
