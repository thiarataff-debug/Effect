<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Effect — Visualizador Sheets</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--navy:#1a2a4a;--white:#fff;--bg:#f5f7fa;--muted:#a1a1aa;--green:#8ed1b2;--blue:#1fa5ff;--pink:#f4afa1}
  body{font-family:'Montserrat',sans-serif;background:var(--bg);color:#2a2a2b;height:100vh;display:flex;flex-direction:column}

  header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .logo{font-weight:700;font-size:16px}.logo span{color:var(--green)}
  .tabs{display:flex;gap:4px}
  .tab{padding:7px 16px;border-radius:8px;border:none;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.1);color:#fff;transition:all .2s}
  .tab.active{background:var(--blue);color:#fff}
  .tab:hover:not(.active){background:rgba(255,255,255,.2)}

  .content{flex:1;overflow:hidden;display:flex;flex-direction:column}

  /* LOADING */
  .loading{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted)}
  .spinner{width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* STATS BAR */
  .stats-bar{background:#fff;padding:12px 24px;border-bottom:1px solid #e5e7eb;display:flex;gap:16px;flex-shrink:0;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat-num{font-size:20px;font-weight:700;color:var(--navy)}
  .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  /* FILTERS */
  .filters{background:#fff;padding:10px 24px;border-bottom:1px solid #e5e7eb;display:flex;gap:10px;flex-shrink:0;flex-wrap:wrap;align-items:center}
  .filter-input{padding:7px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:12px;outline:none;transition:border .2s;min-width:180px}
  .filter-input:focus{border-color:var(--blue)}
  .filter-chip{padding:5px 12px;border-radius:12px;border:1.5px solid #e5e7eb;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;background:#fff}
  .filter-chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}

  /* TABLE */
  .table-wrap{flex:1;overflow:auto;padding:0}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead{position:sticky;top:0;z-index:10}
  th{background:var(--navy);color:#fff;padding:10px 14px;text-align:left;font-weight:600;font-size:11px;white-space:nowrap}
  td{padding:9px 14px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
  tr:hover td{background:#f8fafc}
  tr.excelente td{background:#fffbeb}
  tr.reprovado td{opacity:.6}

  .badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap}
  .badge-excelente{background:#fef3c7;color:#92400e}
  .badge-bom{background:#dcfce7;color:#16a34a}
  .badge-regular{background:#fef9c3;color:#ca8a04}
  .badge-reprovado{background:#fee2e2;color:#dc2626}
  .badge-interessado{background:#dcfce7;color:#16a34a}
  .badge-analisado{background:#e0e7ff;color:#3730a3}
  .badge-default{background:#f3f4f6;color:var(--muted)}

  .score-pill{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700}
  .score-alto{background:#dcfce7;color:#16a34a}
  .score-medio{background:#fef9c3;color:#ca8a04}
  .score-baixo{background:#fee2e2;color:#dc2626}

  /* VAGAS TAB */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:20px 24px;overflow-y:auto;flex:1}
  .vaga-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:4px solid var(--blue)}
  .vaga-card.inativa{border-left-color:var(--muted);opacity:.7}
  .vaga-titulo{font-weight:700;font-size:13px;margin-bottom:4px}
  .vaga-cliente{font-size:11px;color:var(--blue);margin-bottom:8px}
  .vaga-info{display:flex;flex-direction:column;gap:4px}
  .vaga-row{display:flex;gap:6px;font-size:11px;color:#555;align-items:flex-start}
  .vaga-icon{flex-shrink:0;color:var(--muted)}
  .vaga-status{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}

  /* DASHBOARD */
  .dashboard{padding:20px 24px;overflow-y:auto;flex:1}
  .dash-section{margin-bottom:24px}
  .dash-section-title{font-weight:700;font-size:13px;color:var(--navy);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--blue)}
  .dash-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
  .dash-card{background:#fff;border-radius:10px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .dash-num{font-size:28px;font-weight:700;color:var(--navy)}
  .dash-label{font-size:10px;color:var(--muted);margin-top:3px}
  .dash-bar-wrap{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:11px}
  .bar-label{width:140px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{flex:1;background:#f3f4f6;border-radius:4px;height:16px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;transition:width .5s}
  .bar-val{width:40px;text-align:right;font-weight:700;color:var(--navy)}

  .toast{position:fixed;bottom:18px;right:18px;background:#2a2a2b;color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:600;z-index:200;opacity:0;transform:translateY(10px);transition:all .3s}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.success{background:var(--green);color:var(--navy)}
  .toast.error{background:var(--pink);color:#fff}

  .empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}

  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:4px}
</style>
</head>
<body>

<header>
  <div class="logo">Effect <span>Sheets</span> Viewer</div>
  <div class="tabs">
    <button class="tab active" onclick="mudarAba('candidatos')">👥 Candidatos</button>
    <button class="tab" onclick="mudarAba('vagas')">📋 Vagas</button>
    <button class="tab" onclick="mudarAba('dashboard')">📊 Dashboard</button>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="ultima-atualizacao" style="font-size:11px;color:var(--muted)"></span>
    <button onclick="carregarTudo()" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:7px;padding:6px 12px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;cursor:pointer">⟳ Atualizar</button>
  </div>
</header>

<div class="content" id="content">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Carregando dados do Sheets...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = window.location.origin;
let abaAtual = 'candidatos';
let candidatos = [];
let vagas = [];
let filtroStatus = '';
let filtroClassificacao = '';
let termoBusca = '';

async function carregarTudo() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('content').innerHTML = '<div class="loading" id="loading"><div class="spinner"></div><div>Carregando dados...</div></div>';

  try {
    const [rCand, rVagas] = await Promise.all([
      fetch(`${API_BASE}/sheets/candidatos`),
      fetch(`${API_BASE}/sheets/vagas`)
    ]);

    const dCand = await rCand.json();
    const dVagas = await rVagas.json();

    candidatos = dCand.candidatos || [];
    vagas = dVagas.vagas || [];

    document.getElementById('ultima-atualizacao').textContent = `Atualizado: ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;

    renderizarAba();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="empty">❌ Erro ao carregar dados.<br><small>${e.message}</small></div>`;
  }
}

function mudarAba(aba) {
  abaAtual = aba;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['candidatos','vagas','dashboard'][i]===aba));
  renderizarAba();
}

function renderizarAba() {
  if (abaAtual === 'candidatos') renderizarCandidatos();
  else if (abaAtual === 'vagas') renderizarVagas();
  else renderizarDashboard();
}

// ============================================================
// CANDIDATOS
// ============================================================
function renderizarCandidatos() {
  const total = candidatos.length;
  const excelentes = candidatos.filter(c=>c['Classificação']==='Excelente').length;
  const interessados = candidatos.filter(c=>c['Status']==='Interessado').length;
  const comCurriculo = candidatos.filter(c=>c['Currículo']==='Sim').length;
  const scores = candidatos.map(c=>Number(c['Score Geral']||0)).filter(s=>s>0);
  const scoresMedio = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;

  let filtered = candidatos.filter(c => {
    const busca = termoBusca.toLowerCase();
    const matchBusca = !busca || (c['Nome']||'').toLowerCase().includes(busca) || (c['Telefone']||'').includes(busca) || (c['Vaga de Interesse']||'').toLowerCase().includes(busca);
    const matchStatus = !filtroStatus || (c['Status']||'').toLowerCase().includes(filtroStatus.toLowerCase());
    const matchClass = !filtroClassificacao || c['Classificação']===filtroClassificacao;
    return matchBusca && matchStatus && matchClass;
  });

  document.getElementById('content').innerHTML = `
    <div class="stats-bar">
      <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-num" style="color:#f59e0b">${excelentes}</div><div class="stat-label">Excelentes</div></div>
      <div class="stat"><div class="stat-num" style="color:#16a34a">${interessados}</div><div class="stat-label">Interessados</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--blue)">${comCurriculo}</div><div class="stat-label">Com Currículo</div></div>
      <div class="stat"><div class="stat-num">${scoresMedio||'—'}</div><div class="stat-label">Score Médio</div></div>
      <div class="stat"><div class="stat-num">${filtered.length}</div><div class="stat-label">Filtrados</div></div>
    </div>
    <div class="filters">
      <input class="filter-input" placeholder="🔍 Nome, telefone ou vaga..." oninput="termoBusca=this.value;renderizarCandidatos()" value="${termoBusca}">
      ${['','Excelente','Bom','Regular','Reprovado'].map(c=>`<button class="filter-chip ${filtroClassificacao===c&&c?'active':''}" onclick="filtroClassificacao='${c}';renderizarCandidatos()">${c||'Todas classificações'}</button>`).join('')}
      ${['','Interessado','Analisado pela Lia','Reprovado'].map(s=>`<button class="filter-chip ${filtroStatus===s&&s?'active':''}" onclick="filtroStatus='${s}';renderizarCandidatos()">${s||'Todos status'}</button>`).join('')}
    </div>
    <div class="table-wrap">
      ${filtered.length ? `
      <table>
        <thead><tr>
          <th>Nome</th><th>Telefone</th><th>Cidade</th><th>Vaga de Interesse</th>
          <th>Score</th><th>Classificação</th><th>Status</th>
          <th>Experiência</th><th>Escolaridade</th><th>Currículo</th>
          <th>Transporte</th><th>CLT</th><th>Pontos Fortes</th><th>Criado em</th>
        </tr></thead>
        <tbody>
          ${filtered.map(c => {
            const cls = c['Classificação']||'';
            const score = Number(c['Score Geral']||c['Score da Vaga']||0);
            const trClass = cls==='Excelente'?'excelente':cls==='Reprovado'?'reprovado':'';
            const clsBadge = cls==='Excelente'?'badge-excelente':cls==='Bom'?'badge-bom':cls==='Regular'?'badge-regular':cls==='Reprovado'?'badge-reprovado':'badge-default';
            const statusBadge = (c['Status']||'').includes('Interessado')?'badge-interessado':(c['Status']||'').includes('Analisado')?'badge-analisado':'badge-default';
            const scoreCls = score>=80?'score-alto':score>=60?'score-medio':'score-baixo';
            return `<tr class="${trClass}">
              <td><strong>${c['Nome']||'—'}</strong></td>
              <td><a href="https://wa.me/${c['Telefone']}" target="_blank" style="color:var(--blue);text-decoration:none">${c['Telefone']||'—'}</a></td>
              <td>${c['Cidade / Estado']||'—'}</td>
              <td>${c['Vaga de Interesse']||'—'}</td>
              <td>${score?`<span class="score-pill ${scoreCls}">${score}</span>`:'—'}</td>
              <td>${cls?`<span class="badge ${clsBadge}">${cls}</span>`:'—'}</td>
              <td>${c['Status']?`<span class="badge ${statusBadge}">${c['Status']}</span>`:'—'}</td>
              <td>${c['Anos de Experiência']?c['Anos de Experiência']+' anos':'—'}</td>
              <td>${c['Escolaridade Compatível']||'—'}</td>
              <td>${c['Currículo']==='Sim'?'✅':'—'}</td>
              <td>${c['Transporte Próprio']||'—'}</td>
              <td>${c['CLT Imediato']||'—'}</td>
              <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${c['Pontos Fortes']||''}">${c['Pontos Fortes']||'—'}</td>
              <td style="white-space:nowrap">${c['Criado em']||'—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : '<div class="empty">Nenhum candidato encontrado com os filtros aplicados.</div>'}
    </div>
  `;
}

// ============================================================
// VAGAS
// ============================================================
function renderizarVagas() {
  const ativas = vagas.filter(v=>!['inativa','fechada','cancelada'].includes((v.status||'').toLowerCase()));
  const inativas = vagas.filter(v=>['inativa','fechada','cancelada'].includes((v.status||'').toLowerCase()));

  document.getElementById('content').innerHTML = `
    <div class="stats-bar">
      <div class="stat"><div class="stat-num">${vagas.length}</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-num" style="color:#16a34a">${ativas.length}</div><div class="stat-label">Ativas</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--muted)">${inativas.length}</div><div class="stat-label">Encerradas</div></div>
    </div>
    <div class="cards-grid">
      ${vagas.map(v => {
        const inativa = ['inativa','fechada','cancelada'].includes((v.status||'').toLowerCase());
        return `<div class="vaga-card ${inativa?'inativa':''}">
          <div class="vaga-titulo">${v.cargo||'—'}</div>
          <div class="vaga-cliente">${v.cliente||'—'}</div>
          <div class="vaga-info">
            <div class="vaga-row"><span class="vaga-icon">📍</span>${v.cidade||'—'}</div>
            ${v.salario?`<div class="vaga-row"><span class="vaga-icon">💰</span>${v.salario}</div>`:''}
            ${v.horario?`<div class="vaga-row"><span class="vaga-icon">🕐</span>${v.horario}</div>`:''}
            ${v.experienciaMinima?`<div class="vaga-row"><span class="vaga-icon">💼</span>${v.experienciaMinima}</div>`:''}
            ${v.escolaridade?`<div class="vaga-row"><span class="vaga-icon">🎓</span>${v.escolaridade}</div>`:''}
            ${v.beneficios?`<div class="vaga-row"><span class="vaga-icon">⭐</span>${v.beneficios}</div>`:''}
            ${v.requisitoObrigatorio?`<div class="vaga-row"><span class="vaga-icon">⚠️</span><strong>${v.requisitoObrigatorio}</strong></div>`:''}
          </div>
          <div class="vaga-status">
            <span class="badge ${inativa?'badge-reprovado':'badge-interessado'}">${v.status||'Ativa'}</span>
            ${v.aceitaSemExperiencia==='Sim'?'<span class="badge badge-bom">Aceita sem exp.</span>':''}
            ${v.idVaga?`<span class="badge badge-default">#${v.idVaga}</span>`:''}
          </div>
        </div>`;
      }).join('') || '<div class="empty">Nenhuma vaga encontrada.</div>'}
    </div>
  `;
}

// ============================================================
// DASHBOARD
// ============================================================
function renderizarDashboard() {
  const total = candidatos.length;
  const excelentes = candidatos.filter(c=>c['Classificação']==='Excelente').length;
  const bons = candidatos.filter(c=>c['Classificação']==='Bom').length;
  const regulares = candidatos.filter(c=>c['Classificação']==='Regular').length;
  const reprovados = candidatos.filter(c=>c['Classificação']==='Reprovado').length;
  const interessados = candidatos.filter(c=>c['Status']==='Interessado').length;
  const comCurriculo = candidatos.filter(c=>c['Currículo']==='Sim').length;

  // Por vaga
  const porVaga = {};
  candidatos.forEach(c => {
    const v = c['Vaga de Interesse']||'Sem vaga';
    if (!porVaga[v]) porVaga[v] = {total:0,scores:[],excelentes:0};
    porVaga[v].total++;
    const s = Number(c['Score Geral']||c['Score da Vaga']||0);
    if (s>0) porVaga[v].scores.push(s);
    if (c['Classificação']==='Excelente') porVaga[v].excelentes++;
  });

  const maxVaga = Math.max(...Object.values(porVaga).map(v=>v.total),1);

  // Por cidade
  const porCidade = {};
  candidatos.forEach(c => {
    const cidade = (c['Cidade / Estado']||'Não informada').split('/')[0].trim();
    porCidade[cidade] = (porCidade[cidade]||0)+1;
  });
  const cidadesOrdenadas = Object.entries(porCidade).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxCidade = Math.max(...cidadesOrdenadas.map(c=>c[1]),1);

  document.getElementById('content').innerHTML = `
    <div class="dashboard">
      <div class="dash-section">
        <div class="dash-section-title">Visão Geral</div>
        <div class="dash-cards">
          <div class="dash-card"><div class="dash-num">${total}</div><div class="dash-label">Total Candidatos</div></div>
          <div class="dash-card"><div class="dash-num" style="color:#f59e0b">${excelentes}</div><div class="dash-label">Excelentes ⭐</div></div>
          <div class="dash-card"><div class="dash-num" style="color:#16a34a">${bons}</div><div class="dash-label">Bons ✅</div></div>
          <div class="dash-card"><div class="dash-num" style="color:#ca8a04">${regulares}</div><div class="dash-label">Regulares</div></div>
          <div class="dash-card"><div class="dash-num" style="color:#dc2626">${reprovados}</div><div class="dash-label">Reprovados</div></div>
          <div class="dash-card"><div class="dash-num" style="color:#16a34a">${interessados}</div><div class="dash-label">Interessados</div></div>
          <div class="dash-card"><div class="dash-num" style="color:var(--blue)">${comCurriculo}</div><div class="dash-label">Com Currículo</div></div>
          <div class="dash-card"><div class="dash-num">${vagas.filter(v=>!['inativa','fechada','cancelada'].includes((v.status||'').toLowerCase())).length}</div><div class="dash-label">Vagas Ativas</div></div>
        </div>
      </div>

      <div class="dash-section">
        <div class="dash-section-title">Candidatos por Vaga</div>
        <div class="dash-bar-wrap">
          ${Object.entries(porVaga).sort((a,b)=>b[1].total-a[1].total).map(([vaga,d]) => {
            const media = d.scores.length?Math.round(d.scores.reduce((a,b)=>a+b)/d.scores.length):0;
            const pct = Math.round((d.total/maxVaga)*100);
            const cor = d.excelentes>0?'#f59e0b':pct>60?'var(--green)':'var(--blue)';
            return `<div class="bar-row">
              <div class="bar-label" title="${vaga}">${vaga.slice(0,22)}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${cor}"></div></div>
              <div class="bar-val">${d.total}</div>
              <div style="width:60px;font-size:10px;color:var(--muted)">${media?'score '+media:''}</div>
            </div>`;
          }).join('') || '<div style="color:var(--muted);font-size:11px">Sem dados</div>'}
        </div>
      </div>

      <div class="dash-section">
        <div class="dash-section-title">Candidatos por Cidade</div>
        <div class="dash-bar-wrap">
          ${cidadesOrdenadas.map(([cidade,n]) => {
            const pct = Math.round((n/maxCidade)*100);
            return `<div class="bar-row">
              <div class="bar-label">${cidade}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--blue)"></div></div>
              <div class="bar-val">${n}</div>
            </div>`;
          }).join('') || '<div style="color:var(--muted);font-size:11px">Sem dados</div>'}
        </div>
      </div>
    </div>
  `;
}

function mostrarToast(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.className=`toast show ${tipo}`;
  setTimeout(()=>t.className='toast',2500);
}

// Iniciar
carregarTudo();
setInterval(carregarTudo, 60000);
</script>
</body>
</html>
